server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Cloudflare the public host is :443, but nginx listens on :5173.
    # Keep redirects relative so a Location header can never leak ":5173" and
    # send the browser to an unreachable port.
    absolute_redirect off;

    # Astro builds directory-style pages (/projects/index.html). Serve that
    # index.html *directly* for clean URLs like /projects and /projects/lively,
    # so nginx never issues a trailing-slash 301. Unknown paths return a real
    # 404 (this is a multi-page site, not an SPA).
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Fingerprinted assets can be cached aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
