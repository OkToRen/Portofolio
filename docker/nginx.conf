server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds directory-style pages (e.g. /projects/index.html), so
    # `$uri/` resolves clean URLs like /projects -> /projects/index.html.
    # Unknown paths return a real 404 (this is a multi-page site, not an SPA).
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted assets can be cached aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
