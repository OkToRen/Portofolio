# Gitea Actions workflow — builds the site on a self-hosted runner to verify it
# compiles, then exits. Unlike a dev server, `astro build` finishes and returns
# an exit code, so the job turns green (or red) instead of hanging forever.
#
# Requires a Gitea Actions runner registered with the `self-hosted` label.

name: Build

on:
  pull_request:
  workflow_dispatch: # allow manual runs from the Gitea Actions UI

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
