# Gitea Actions workflow — deploys the site on the self-hosted server with
# Docker Compose. On every push to main it rebuilds the image and (re)starts
# the `portfolio` container, which nginx serves on port 5173.
#
# REQUIREMENTS on the runner (one-time):
#   - the Docker CLI + Compose plugin available inside the job, and
#   - access to the host Docker daemon (the act_runner must mount
#     /var/run/docker.sock into the job container, or run this job on a
#     host-level runner label).
# The build context is streamed to the daemon, so `--build` works over the
# mounted socket; the published 5173 port binds on the host.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Fetch the commit straight from this Gitea server instead of using
      # actions/checkout, which the runner has to download from github.com
      # first. The home server can't always reach GitHub, and when it can't,
      # the deploy fails before it starts.
      - name: Checkout
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "${{ gitea.ref }}"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Build image & (re)start container
        run: docker compose up -d --build

      - name: Prune dangling build layers
        run: docker image prune -f
